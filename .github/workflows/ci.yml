name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The runtime import dependency goes one way: mechanics imports
      # machinome. `machinome>=0.7.0` is not on PyPI yet, so until it is
      # the framework comes from its repository; the helpers need no CAD
      # binary, so nothing else is installed here.
      - name: Install the framework and this package
        run: |
          pip install "machinome @ git+https://github.com/machinome/machinome.git"
          pip install -e ".[dev]"

      - run: python -m pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Kept in step with .readthedocs.yaml, which installs exactly this
      # and no CAD runtime: the manual renders without importing one.
      - name: Install the documentation requirements
        run: pip install -r docs/requirements.txt

      - name: Build docs (fail on warnings)
        run: python -m sphinx -b html -W docs docs/_build

  dist:
    runs-on: ubuntu-latest
    needs: [test, docs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # check-dist installs the built archives with `--no-deps` and lends
      # them this interpreter's dependencies, so the framework it imports
      # has to be here.
      - name: Install the build tools and the framework the smoke imports
        run: |
          pip install build twine
          pip install "machinome @ git+https://github.com/machinome/machinome.git"

      - name: Build and smoke the distributions without publishing
        run: python scripts/check-dist
